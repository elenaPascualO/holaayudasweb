<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Social Banners - HolaDatos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px;
      font-family: -apple-system, sans-serif;
    }
    h2 { color: #666; font-size: 14px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
    .banner-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .scale-wrapper { transform: scale(0.55); transform-origin: top center; }
    .banner { position: relative; overflow: hidden; background: #111; }
    .banner-x { width: 1500px; height: 500px; }
    .banner-linkedin { width: 1584px; height: 396px; }
    .glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 40% 50% at 50% 48%, rgba(212,207,199,0.05) 0%, transparent 70%);
    }
    .grain {
      position: absolute; inset: 0; z-index: 3; opacity: 0.2; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }
    .accent {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px; z-index: 4;
      background: linear-gradient(90deg, transparent 10%, rgba(212,207,199,0.2) 30%, rgba(212,207,199,0.35) 50%, rgba(212,207,199,0.2) 70%, transparent 90%);
    }
  </style>
</head>
<body>

  <!-- Shared Spain path based on real geographic coordinates -->

        L 242,26 L 253,32 L 261,24 L 281,30 L 289,29 L 297,27
        L 315,45 L 345,55 L 374,63 L 396,60

        L 336,308 L 328,315 L 315,317 L 305,325
        L 296,336 L 281,359 L 271,354

        L 156,389 L 150,395
        L 138,386 L 131,381 L 124,369

        L 120,129 L 99,102 L 91,92
        L 63,98 L 33,93 L 25,89
        L 30,83 L 28,76 L 24,68 L 20,67 L 22,56
        L 9,51 Z
      "/>
    </defs>
  </svg>

  <!-- X / Twitter Banner: 1500 x 500 -->
  <div class="banner-wrapper">

            <filter id="og"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>

          <!-- transform: translate(479, 33) scale(1.08) -->

          <use href="#spain" transform="translate(479,33) scale(1.08)" stroke="#d4cfc7" stroke-width="1.5" fill="none" opacity="0.30" stroke-linejoin="round"/>

          <!-- Network: city coords transformed -->

            <line x1="720" y1="221" x2="610" y2="273" opacity="0.08"/><!-- Caceres -->
            <line x1="720" y1="221" x2="678" y2="155" opacity="0.08"/><!-- Valladolid -->
            <line x1="720" y1="221" x2="676" y2="358" opacity="0.09"/><!-- Cordoba -->
            <line x1="720" y1="221" x2="724" y2="396" opacity="0.08"/><!-- Granada -->

            <!-- Barcelona -->
            <line x1="964" y1="169" x2="838" y2="155" opacity="0.1"/><!-- Zaragoza -->
            <line x1="964" y1="169" x2="858" y2="273" opacity="0.08"/><!-- Valencia -->

            <line x1="676" y1="358" x2="724" y2="396" opacity="0.06"/><!-- Cordoba-Granada -->
            <line x1="797" y1="299" x2="827" y2="353" opacity="0.06"/><!-- Albacete-Murcia -->
          </g>

          <!-- Warm accent on key connections -->
          <g stroke="#c8a87c" fill="none" stroke-width="0.4" opacity="0.07">
            <line x1="720" y1="221" x2="964" y2="169"/>
            <line x1="720" y1="221" x2="752" y2="68"/>
            <line x1="720" y1="221" x2="858" y2="273"/>

          </g>

          <!-- City dots -->
          <g filter="url(#dg)">
            <circle cx="720" cy="221" r="4" fill="#d4cfc7" opacity="0.9"/><!-- Madrid -->
            <circle cx="964" cy="169" r="3.2" fill="#d4cfc7" opacity="0.85"/><!-- Barcelona -->

            <circle cx="752" cy="68" r="2.5" fill="#d4cfc7" opacity="0.75"/><!-- Bilbao -->
            <circle cx="838" cy="155" r="2.3" fill="#d4cfc7" opacity="0.7"/><!-- Zaragoza -->
            <circle cx="827" cy="353" r="2.3" fill="#d4cfc7" opacity="0.65"/><!-- Murcia -->
            <circle cx="690" cy="421" r="2.3" fill="#d4cfc7" opacity="0.65"/><!-- Malaga -->
            <circle cx="519" cy="88" r="2.2" fill="#d4cfc7" opacity="0.6"/><!-- Santiago -->
            <circle cx="676" cy="358" r="2.2" fill="#d4cfc7" opacity="0.65"/><!-- Cordoba -->
            <circle cx="678" cy="155" r="2" fill="#d4cfc7" opacity="0.6"/><!-- Valladolid -->

          </g>

          <!-- Madrid warm glow -->
          <circle cx="720" cy="221" r="50" fill="#c8a87c" opacity="0.025"/>
          <circle cx="720" cy="221" r="20" fill="#d4cfc7" opacity="0.035"/>
        </svg>
        <div class="grain"></div>
        <div class="accent"></div>
      </div>
    </div>
  </div>

  <!-- LinkedIn Banner: 1584 x 396 -->
